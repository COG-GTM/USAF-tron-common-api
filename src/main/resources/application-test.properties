appsource.definition-file=/appsourceapis/appSourceConfig.test.json

#disable saving metrics to database
metrics.save.enabled=false

#disable metric filter
metrics.gateway.count=false

#disable caching
caching.enabled=false

# disable minio
minio.enabled=false

#disable security
security.enabled=false

spring.datasource.hikari.connection-init-sql=SET NON_KEYWORDS KEY, VALUE
spring.test.database.replace=none
